name: 🐛 Bug report
description: Something in NSR does not work the way it should
title: "🐛 [Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Found a bug? Let's squash it!

        Thanks for taking the time. A good report is half of the fix, so the more details you give, the faster it gets solved. 🙏

        > 💡 **Tip:** NSR saves a log in `%USERPROFILE%\NSR_Backup`. You can open that folder from **About and Updates** (`9`) in the menu.
        >
        > 🔒 Remove private data (public IP, Wi-Fi names and passwords, MAC addresses) from anything you paste.

  - type: input
    id: version
    attributes:
      label: 🏷️ NSR version
      description: Shown in the top-right corner of every screen and in **About and Updates**. Please use the latest version first.
      placeholder: "v1.3"
    validations:
      required: true

  - type: dropdown
    id: windows
    attributes:
      label: 🪟 Windows version
      options:
        - Windows 11
        - Windows 10
        - Other / not sure
    validations:
      required: true

  - type: input
    id: build
    attributes:
      label: 🔢 Windows build number
      description: Press Win + R, type `winver` and press Enter.
      placeholder: "22631"

  - type: dropdown
    id: option
    attributes:
      label: 📍 Where did it happen?
      options:
        - "🚪 Startup or main screen"
        - "🛠️ [1] Fix My Connection - Quick Fix"
        - "🔌 [1] Fix My Connection - Restart Adapters"
        - "🔧 [1] Fix My Connection - Full Reset"
        - "🔒 [2] DNS Center"
        - "🏁 [3] DNS Speed Test"
        - "🩺 [4] Network Diagnostics"
        - "⚡ [5] Speed and Lag Test"
        - "📶 [6] Wi-Fi Tools"
        - "🧰 [7] Network Toolbox"
        - "🧪 [8] Bufferbloat Optimizer"
        - "ℹ️ [9] About and Updates"
        - "❓ Other"
    validations:
      required: true

  - type: input
    id: path
    attributes:
      label: 🧭 Menu path
      description: The line under the header of the screen.
      placeholder: "Home / Network Toolbox / Best MTU"
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: 💥 What happened?
      description: Tell us what you saw, and what you expected to see instead.
      placeholder: "When I choose ... the script ... but I expected ..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔁 Steps to reproduce
      placeholder: |
        1. Run NSR.bat
        2. Press 7
        3. Choose ...
        4. See the error
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: 📋 Log or screenshot
      description: |
        Paste the last lines of `NSR_log.txt`, or drag a screenshot into this box.
        Please remove anything private, such as your public IP.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: ✅ Before sending
      options:
        - label: I use the latest NSR.bat from this repository or getnsr.xyz
          required: true
        - label: I ran NSR as administrator
          required: true
        - label: I searched the existing issues and this was not reported yet
          required: true
