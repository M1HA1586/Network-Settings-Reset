name: ✨ Feature request
description: Suggest an idea or an improvement for NSR
title: "✨ [Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Got an idea? We want to hear it!

        NSR is meant to stay **one simple `.bat` file**. Ideas that keep it **simple, safe and reversible** are the easiest to add. 🚀

        The best requests start with the **problem**, not the solution, and fit one of the menu groups: **FIX, DNS, TEST or TOOLS**.

  - type: dropdown
    id: area
    attributes:
      label: 🧭 Which part is it about?
      options:
        - "🛠️ FIX - Fix My Connection"
        - "🔒 DNS - DNS Center"
        - "🏁 DNS - DNS Speed Test"
        - "🩺 TEST - Network Diagnostics"
        - "⚡ TEST - Speed and Lag Test"
        - "📶 TEST - Wi-Fi Tools"
        - "🧰 TOOLS - Network Toolbox"
        - "🧪 TOOLS - Bufferbloat Optimizer"
        - "🎨 Menu and design"
        - "🆕 Something completely new"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 🎯 What problem would it solve?
      placeholder: "I often have to ... and it takes a long time because ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💡 What would you like NSR to do?
      placeholder: "A new menu option that ..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔀 Other ways you thought about
      description: Optional. Tools or tricks you use today for the same thing.
    validations:
      required: false

  - type: checkboxes
    id: rules
    attributes:
      label: 📐 Does it fit the promises of NSR?
      description: See CONTRIBUTING.md.
      options:
        - label: It needs no telemetry, no account and no hidden download
        - label: Anything it changes can be undone
        - label: It works on Windows 10 and 11 with the PowerShell that Windows includes

  - type: checkboxes
    id: checks
    attributes:
      label: ✅ Before sending
      options:
        - label: I searched the existing issues and this was not suggested yet
          required: true
